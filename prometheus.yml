global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  
  - job_name: "spark-driver"
    metrics_path: /metrics/prometheus/
    static_configs:
      - targets: ["host.docker.internal:4040"]   

  - job_name: "spark-executors"
    metrics_path: /metrics/executors/prometheus/
    static_configs:
      - targets: ["host.docker.internal:4040"]   
